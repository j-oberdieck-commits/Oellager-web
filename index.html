/* Glaskacheln auf weichem Farbhintergrund – wie in der Android-App */
:root {
  --primary: #1F4E5F;
  --on-primary: #ffffff;
  --akzent: #B7791F;
  --text: #161C1F;
  --neben: #4A5559;

  --hinter-b: #F3EEE4;
  --fleck-1: rgba(111,187,208,.60);
  --fleck-2: rgba(242,184,91,.55);
  --fleck-3: rgba(154,174,242,.50);
  --gut: #1E8A55;
  --teuer: #C62828;
  --feld: rgba(255,255,255,.7);
  --schatten: 0 8px 28px rgba(22,28,31,.08);
  --schrift: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary: #8FCBDD; --on-primary: #003544; --akzent: #F2B85B;
    --text: #DEE3E5; --neben: #BFC8CB;
    --glas: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    --kante: rgba(255,255,255,.28); --linie: rgba(255,255,255,.12);
    --hinter-a: #081115; --hinter-b: #0E1C23;
    --fleck-1: rgba(31,113,137,.55); --fleck-2: rgba(183,121,31,.38); --fleck-3: rgba(57,73,168,.40);
    --gut: #5CD69A; --teuer: #FF8A80; --feld: rgba(255,255,255,.08);
    --schatten: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --primary: #8FCBDD; --on-primary: #003544; --akzent: #F2B85B;
  --text: #DEE3E5; --neben: #BFC8CB;
  --glas: linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
  --kante: rgba(255,255,255,.28); --linie: rgba(255,255,255,.12);
  --hinter-a: #081115; --hinter-b: #0E1C23;
  --fleck-1: rgba(31,113,137,.55); --fleck-2: rgba(183,121,31,.38); --fleck-3: rgba(57,73,168,.40);

  --schatten: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {

}
button, input, select, textarea { font: inherit; color: inherit; }

  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.kopf { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }

.glas { background: var(--glas); border: 1px solid var(--kante); border-radius: 20px; box-shadow: var(--schatten);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); position: relative; overflow: hidden; }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .glas::before { background: linear-gradient(180deg, rgba(255,255,255,.08), transparent); } }
.reihe { display: flex; gap: 10px; align-items: center; }

.kachel-zahl { padding: 10px 12px; }

.stapel { display: grid; gap: 12px; margin-top: 12px; }

.seg button { flex: 1; border: 0; background: transparent; padding: 8px 12px; border-radius: 999px; cursor: pointer; font-weight: 550; }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.knopf { border: 1px solid var(--linie); background: var(--feld); padding: 8px 14px; border-radius: 12px; cursor: pointer; font-weight: 550; white-space: nowrap; }

.icon { border: 0; background: transparent; cursor: pointer; padding: 8px; border-radius: 10px; font-size: 18px; }
.icon:hover { background: var(--feld); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
input[type=text], input[type=email], input[type=password], input[type=search], select, textarea {
  width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--linie); background: var(--feld); }
label.feld { display: grid; gap: 4px; font-size: 13px; color: var(--neben); }
label.feld > span { padding-left: 2px; }
.gruppe { cursor: pointer; }
.gruppe-kopf { display: flex; align-items: center; gap: 12px; padding: 14px 16px 14px 12px; }

.gruppe-titel { font-size: 22px; font-weight: 750; }

.preis.gut .preis-gross::before, .fass .preis.gut::before { content: "▼ "; font-size: .7em; }
.preis.teuer .preis-gross::before, .fass .preis.teuer::before { content: "▲ "; font-size: .7em; }
.innen { padding: 0 16px 12px 30px; border-top: 1px solid var(--linie); cursor: default; }

.badge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 750; font-size: 12px; flex: none; }
.pille { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; background: rgba(31,78,95,.12); margin: 2px 4px 2px 0; }
.pille.alarm { background: rgba(183,121,31,.18); }
.pille.bester { background: var(--primary); color: var(--on-primary); }
.liste-zeile { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--linie); cursor: pointer; }
.liste-zeile:last-child { border-bottom: 0; }
.abschnitt-titel { font-size: 14px; font-weight: 700; color: var(--primary); margin: 18px 4px 6px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); background: color-mix(in srgb, var(--hinter-b) 70%, transparent); border-top: 1px solid var(--linie); }
nav.tabs .seg { max-width: 640px; margin: 0 auto; }
nav.tabs .seg button { padding: 8px 4px; font-size: 13px; }
.kopf { position: relative; }
.menue { position: absolute; right: 0; top: 100%; z-index: 30; display: grid; min-width: 230px; padding: 6px; border-radius: 16px;
  background: color-mix(in srgb, var(--hinter-b) 94%, transparent); }
.menue button { text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 15px; }
.menue button:hover, .menue button:focus-visible { background: var(--feld); }
.zaehler { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--teuer); color: #fff; font-size: 11px; font-weight: 700; vertical-align: top; }
.leer { text-align: center; padding: 28px 16px; color: var(--neben); }
.status { font-size: 12px; color: var(--neben); }
.status.fehler { color: var(--teuer); }
.hinweis { padding: 12px 14px; border-radius: 14px; background: rgba(183,121,31,.16); margin-top: 12px; }
dialog { border: 0; padding: 0; background: transparent; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 24px); color: var(--text); }
dialog::backdrop { background: rgba(0,0,0,.35); backdrop-filter: blur(2px); }
.dialog-innen { padding: 18px; display: grid; gap: 12px; max-height: calc(100vh - 40px); overflow: auto;
  background: color-mix(in srgb, var(--hinter-b) 92%, transparent); border-radius: 20px; border: 1px solid var(--kante); }
.dialog-innen h2 { margin: 0; font-size: 19px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--linie); background: var(--feld); border-radius: 999px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: transparent; }
.login { max-width: 420px; margin: 12vh auto 0; padding: 24px; display: grid; gap: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 20;
  background: var(--text); color: var(--hinter-b); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100vw - 32px); }
body.nur-lesen [data-a="sorte-neu"], body.nur-lesen [data-a="fass-neu"], body.nur-lesen [data-v="neu"],
body.nur-lesen [data-a$="-speichern"], body.nur-lesen [data-a$="-loeschen"], body.nur-lesen [data-a="fass-leer"], body.nur-lesen [data-a="fass-aktiv"] { display: none !important; }
.banner { margin-top: 12px; padding: 8px 12px; border-radius: 12px; background: rgba(31,78,95,.12); font-size: 13px; }

.geteilt .detail { position: sticky; top: 84px; margin-top: 12px; max-height: calc(100vh - 180px); overflow: auto; }
.gruppe.gewaehlt { outline: 2px solid var(--primary); }

/* ---------- Oberflächen (vom Entwickler je Standort gewählt) ---------- */
:root[data-ob="dunkel"] {

  --glas: #161D21; --kante: #2A3439; --linie: #2A3439; --hinter-a: #0D1114; --hinter-b: #0D1114;
  --fleck-1: transparent; --fleck-2: transparent; --fleck-3: transparent; --feld: #11171A;

}
:root[data-ob="kompakt"] { --glas: #FFFFFF; --kante: #E2E7E9; --hinter-a: #FFFFFF; --hinter-b: #FFFFFF; --fleck-1: transparent; --fleck-2: transparent; --fleck-3: transparent; --schatten: none; }
:root[data-ob="kennzahlen"] { --glas: #FFFFFF; --kante: transparent; --hinter-a: #EEF2F3; --hinter-b: #EEF2F3; --fleck-1: transparent; --fleck-2: transparent; --fleck-3: transparent; --schatten: 0 1px 2px rgba(0,0,0,.05); }
:root[data-ob]:not([data-ob="glas"]) .glas { backdrop-filter: none; -webkit-backdrop-filter: none; }
:root[data-ob]:not([data-ob="glas"]) .glas::before { display: none; }
:root[data-ob="dunkel"] .gruppe-titel { font-size: 26px; font-weight: 900; }
:root[data-ob="dunkel"] .preis-gross { font-size: 30px; font-weight: 900; }
:root[data-ob="dunkel"] .bestand { min-width: 64px; padding: 10px; }
:root[data-ob="dunkel"] .bestand b { font-size: 26px; }
.kz-karte { margin-top: 12px; padding: 18px; border-radius: 24px; background: #1F4E5F; color: #fff; display: grid; gap: 14px; }
.kz-karte .hell { color: #BFE0EA; font-size: 12px; }
.kz-gross { font-size: 42px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.kz-balken { position: relative; height: 10px; border-radius: 5px; background: linear-gradient(90deg, #7DE0AE, #F2B85B 55%, #FF9E8A); }

.kz-raster { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.kz-kachel { border-radius: 22px; background: var(--glas); overflow: hidden; cursor: pointer; box-shadow: var(--schatten); }
.kz-kachel .band { height: 6px; }

.kp-tabelle { margin-top: 12px; border-top: 1px solid var(--kante); }
.kp-kopf, .kp-zeile { display: grid; grid-template-columns: 84px minmax(0, 1fr) 54px 84px; gap: 8px; align-items: center; padding: 8px 4px; }
.kp-kopf { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--neben); border-bottom: 1px solid var(--kante); }
.kp-zeile { min-height: 56px; border-bottom: 1px solid var(--kante); cursor: pointer; }

.kp-zeile .r, .kp-kopf .r { text-align: right; }

  .raster-gruppen { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: start; }
}
.skelett { height: 92px; margin-top: 12px; }
.skelett::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-100%); }
@media (prefers-reduced-motion: no-preference) {
  .glas { transition: border-color .15s, outline-color .15s; }
